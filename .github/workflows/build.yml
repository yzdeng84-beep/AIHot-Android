name: Build and Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIHOT-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk AIHOT-v1.0.0.apk

      - name: Generate release notes
        run: |
          cat > release_notes.md << 'EOF'
          ## 📱 AI HOT - Android 客户端

          将 [aihot.virxact.com](https://aihot.virxact.com/) 封装为原生 Android App，方便在手机上随时查看 AI 热点资讯。

          ### ✨ 功能
          - 原生安卓体验，Splash 启动屏
          - 下拉刷新获取最新资讯
          - 返回键智能导航网页历史
          - 断网自动检测 + 一键重试
          - 深色主题，与网站风格一致

          ### 📥 安装说明
          1. 下载下方 APK 文件
          2. 在手机上打开，允许"安装未知来源应用"
          3. 安装完成即可使用

          ---
          本项目非官方出品，仅供学习交流。内容版权归 [AI HOT](https://aihot.virxact.com/) 所有。
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AI HOT ${{ github.ref_name }}"
          body_path: release_notes.md
          files: AIHOT-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
